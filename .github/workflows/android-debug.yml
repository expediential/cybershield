name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      # Debug builds load JavaScript from Metro. The release variant invokes
      # bundleReleaseJsAndAssets, so the installed APK works without Metro.
      - run: cd android && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk CyberShield.apk
      - run: sha256sum CyberShield.apk > CyberShield.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CyberShield.apk
          path: |
            CyberShield.apk
            CyberShield.apk.sha256
      - name: Publish tagged Android MVP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CyberShield Android MVP
          generate_release_notes: true
          files: |
            CyberShield.apk
            CyberShield.apk.sha256
